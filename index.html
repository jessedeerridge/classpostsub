<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <title>ito · 数字をひく</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #f4f1e8; color: #263b32; font-family: system-ui, sans-serif; }
    main { width: min(100% - 40px, 440px); margin: auto; padding: 40px 0 28px; text-align: center; }
    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; }
    h1 { font-size: 32px; letter-spacing: .08em; margin: 0; }
    #remaining { font-size: 13px; color: #56685e; }
    .label { font-size: 14px; margin-bottom: 16px; }
    .card { width: min(100%, 280px); aspect-ratio: 3 / 4; margin: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fffdf7; border: 1px solid #d4d9c9; border-radius: 24px; box-shadow: 0 12px 30px #263b3210; }
    #number { font-size: clamp(80px, 23vw, 112px); line-height: 1.3; font-weight: 700; font-variant-numeric: tabular-nums; }
    .range { color: #78816c; letter-spacing: .2em; font-size: 12px; }
    #status { min-height: 3.5em; margin: 24px 0 16px; font-size: 14px; line-height: 1.8; overflow-wrap: anywhere; }
    button { width: 100%; min-height: 56px; background: #294f40; color: white; border: none; border-radius: 14px; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover:not(:disabled) { background: #1b3b2d; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible { outline: 3px solid #a77027; outline-offset: 4px; }
    footer { color: #56685e; font-size: 12px; line-height: 1.9; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <header><h1>ito</h1><span id="remaining">接続中…</span></header>
    <p class="label">あなたの数字</p>
    <div class="card"><output id="number" aria-label="あなたの数字" aria-live="polite">—</output><span class="range">1 — 100</span></div>
    <p id="status" role="status">接続しています…</p>
    <button id="start" type="button" disabled>開始</button>
    <footer>同じ数字が、同時に配られることはありません。<br>引き直すと、前の数字はデッキに戻ります。<br>接続が切れた場合も、サーバーが切断を検知すると返却されます。</footer>
  </main>
  <script type="module" src="./ito/app.js"></script>
</body>
</html>
